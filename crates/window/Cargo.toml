[package]
name = "window"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
engine = { path = "../engine" }
geocoding = { path = "../geocoding" }
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["default", "all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
